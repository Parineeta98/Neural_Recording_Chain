[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-recording-chain"
version = "0.0.1"
description = "Simulating the path from neuron to bits in a brain-computer interface recording chain."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Parineeta Ekhande" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "brian2>=2.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
